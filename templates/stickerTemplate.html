<!DOCTYPE html>
<html style="width: 732px; height: 342px">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        width: 732px;
        height: 342px;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        font-size: 5mm;
        box-sizing: border-box;
      }

      .wrapper {
        width: 100%;
        height: 100%;
        padding: 2mm 3mm;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 1mm;
      }

      .line {
        margin-bottom: 0.8mm;
        white-space: pre-wrap;
        word-break: break-word;
        width: 100%;
      }

      .drink-name {
        font-weight: bold;
      }

      .drink-note {
        font-style: italic;
        font-size: 3.1mm;
        margin-bottom: 1mm;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="top-row">
        <div>{{message}}</div>
        <div>Order: {{order}}, Round: {{round}}</div>
      </div>

      <div class="line">{{pcs}} <span class="drink-name">{{name}}</span></div>

      <div class="drink-note">{{sweetness}} ; {{ice}}</div>

      {{toppingsList}}
    </div>
  </body>
</html>
