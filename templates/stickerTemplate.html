<!DOCTYPE html>
<html style="width: 732px; height: 342px">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Atozimple";
        src: url("../fonts/Atozimple Regular.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Atozimple";
        src: url("../fonts/Atozimple Medium.otf") format("opentype");
        font-weight: 500;
        font-style: normal;
      }

      html,
      body {
        width: 732px;
        height: 342px;
        margin: 0;
        padding: 0;
        font-family: "Atozimple", sans-serif;
        font-size: 5mm;
        box-sizing: border-box;
        background-color: white;
        color: black;
      }

      .wrapper {
        width: 100%;
        height: 100%;
        padding: 2mm 3mm;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        background-color: white;
      }

      .top-row {
        display: flex;
        justify-content: flex-start;
        gap: 60mm;
        width: 100%;
        margin-bottom: 1mm;
      }

      .line {
        margin-bottom: 1.5mm;
        white-space: pre-wrap;
        word-break: break-word;
        width: 100%;
        font-size: 6mm;
      }

      .message {
        font-family: "Atozimple Regular", sans-serif;
      }

      .order-info {
        font-family: "Atozimple Regular", sans-serif;
      }

      .drink-name {
        font-family: "Atozimple Regular", sans-serif;
        font-size: 6.5mm;
      }

      .drink-note {
        font-family: "Atozimple Regular", sans-serif;
        font-size: 6mm;
        margin-bottom: 1.2mm;
        font-style: italic;
      }

      .topping {
        font-family: "Atozimple Regular", sans-serif;
        font-size: 6mm;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="top-row">
        <div class="message">{{message}}</div>
        <div class="order-info">Order: {{order}}, Drink: {{round}}</div>
      </div>

      <div class="line"><span class="drink-name">{{name}}</span></div>

      <div class="drink-note">{{drinkNote}}</div>
      {{milkAlcoholNoteHtml}} {{flavorHtml}} {{extraShotsList}} {{toppingsList}}
    </div>
  </body>
</html>
